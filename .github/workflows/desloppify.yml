name: Desloppify Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Public desloppify release from PyPI, pinned by version and wheel SHA-256.
# To update: take the new wheel's URL and sha256 from https://pypi.org/pypi/desloppify/json
env:
  DESLOPPIFY_WHEEL: desloppify-1.0-py3-none-any.whl
  DESLOPPIFY_WHEEL_URL: https://files.pythonhosted.org/packages/cb/44/dfc6b21433f85acd2a904d2885a6cfe191dead3e1dee9c3d0687a4ec8fcf/desloppify-1.0-py3-none-any.whl
  DESLOPPIFY_WHEEL_SHA256: 77d8bcfacd21edb8efc064fd94ab3adec7221f5efff192b7a2a0f0c55564f007

jobs:
  quality:
    name: Code Quality Gate (score >= 70)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install desloppify (pinned, hash-checked)
        run: |
          curl -sSfL -o "/tmp/${DESLOPPIFY_WHEEL}" "${DESLOPPIFY_WHEEL_URL}"
          echo "${DESLOPPIFY_WHEEL_SHA256}  /tmp/${DESLOPPIFY_WHEEL}" | sha256sum -c -
          pip install "/tmp/${DESLOPPIFY_WHEEL}[full]"

      - name: Run quality gate
        run: |
          SCAN_OUTPUT=$(desloppify scan --path . --profile ci --no-badge 2>&1)
          echo "${SCAN_OUTPUT}"
          SCORE=$(echo "${SCAN_OUTPUT}" | grep -oP 'objective \K[\d.]+(?=/100)' | tail -n 1)
          if [ -z "${SCORE}" ]; then
            echo "ERROR: could not extract objective score from desloppify output"
            exit 1
          fi
          echo "Objective score: ${SCORE}/100"
          python3 -c "
          score = float('${SCORE}')
          threshold = 70
          if score < threshold:
              print(f'FAIL: objective score {score} is below the minimum {threshold}')
              raise SystemExit(1)
          print(f'PASS: objective score {score} >= {threshold}')
          "
          echo "## Desloppify Quality Gate" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| | |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Objective score | **${SCORE}/100** |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Threshold | 70 |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Scan path | \`.\` |" >> "${GITHUB_STEP_SUMMARY}"
          python3 -c "
          score = float('${SCORE}')
          result = 'PASS' if score >= 70 else 'FAIL'
          print(f'| Result | **{result}** |')
          " >> "${GITHUB_STEP_SUMMARY}"
